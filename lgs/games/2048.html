<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2048</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
      background: #faf8ef;
      font-family: 'Clear Sans', 'Helvetica Neue', Arial, sans-serif;
      color: #776e65;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .menu-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(238, 228, 218, 0.98);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      backdrop-filter: blur(4px);
    }
    .menu-panel {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      text-align: center;
    }
    .menu-panel h1 {
      font-size: 48px;
      margin: 0 0 20px;
    }
    .menu-btn {
      background: #8f7a66;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 18px;
      border-radius: 8px;
      margin: 8px 0;
      width: 100%;
      cursor: pointer;
      font-weight: bold;
      transition: 0.1s;
    }
    .menu-btn:active { transform: scale(0.97); }
    .settings-group {
      margin: 15px 0;
      text-align: left;
    }
    .settings-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    select, input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #bbada0;
      font-size: 16px;
    }
    .game-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      max-width: 550px;
      padding: 5px 0;
      box-sizing: border-box;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: flex-end;
      width: 100%;
      margin-bottom: 5px;
      flex-shrink: 0;
    }
    .scores {
      display: flex;
      gap: 10px;
    }
    .score-box {
      background: #bbada0;
      color: white;
      padding: 3px 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 10px;
      font-weight: bold;
    }
    .score-box span {
      font-size: 22px;
      display: block;
    }
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-bottom: 5px;
      width: 100%;
      flex-shrink: 0;
    }
    .control-panel button {
      background: #8f7a66;
      border: none;
      color: white;
      font-weight: bold;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      transition: 0.1s;
      min-width: 44px;
    }
    .control-panel button:active { transform: scale(0.96); }
    .grid-container {
      background-color: #bbada0;
      border-radius: 10px;
      padding: 10px;
      position: relative;
      width: min(80vmin, 500px);
      height: min(80vmin, 500px);
      flex-shrink: 0;
    }
    .grid-container.size-3, .grid-container.size-4, .grid-container.size-5,
    .grid-container.size-6, .grid-container.size-7 { }
    #grid-cells {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: grid;
      grid-gap: 10px;
    }
    .grid-cell {
      background-color: #cdc1b4;
      border-radius: 6px;
      aspect-ratio: 1 / 1;
    }
    .tile-container {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: grid;
      grid-gap: 10px;
      pointer-events: none;
      z-index: 2;
    }
    .tile {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      font-weight: bold;
      font-size: clamp(16px, 5vw, 32px);
      transition: all 0.1s ease;
      animation: appear 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-sizing: border-box;
      line-height: 1;
    }
    @keyframes appear {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .tile-merge {
      animation: merge 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes merge {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); background-color: #f2b179; }
      100% { transform: scale(1); }
    }
    .game-over {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(238, 228, 218, 0.73);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: bold;
      z-index: 10;
      border-radius: 10px;
    }
    /* ИСПРАВЛЕНИЕ: поднимаем модальные окна выше меню */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 2500;            /* было 1000 → теперь выше меню (2000) */
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #faf8ef;
      border-radius: 12px;
      padding: 20px;
      max-width: 90%;
      width: 350px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .close-modal { float: right; font-size: 24px; cursor: pointer; }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #8f7a66;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 1100;
      animation: fadeOut 2s forwards;
      pointer-events: none;
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      70% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
  </style>
</head>
<body>

<!-- Главное меню -->
<div id="mainMenu" class="menu-screen">
  <div class="menu-panel">
    <h1>2048</h1>
    <button class="menu-btn" id="startClassicBtn">Классический режим</button>
    <button class="menu-btn" id="startEndlessBtn">Бесконечный режим</button>
    <button class="menu-btn" id="openSettingsBtn">Настройки</button>
    <button class="menu-btn" id="recordsMenuBtn">Рекорды</button>
  </div>
</div>

<!-- Игровой контейнер -->
<div id="gameContainer" class="game-container">
  <div class="header">
    <div class="scores">
      <div class="score-box">Счет<br><span id="score">0</span></div>
      <div class="score-box">Рекорд<br><span id="best">0</span></div>
      <div class="score-box">Время<br><span id="timer">00:00</span></div>
    </div>
  </div>
  <div class="control-panel">
    <button id="newGameBtn" title="Новая игра">🔄</button>
    <button id="undoBtn" title="Отмена">↩️</button>
    <button id="recordsBtn" title="Рекорды">🏆</button>
    <button id="settingsGameBtn" title="Настройки">⚙️</button>
    <button id="exitToMenuBtn" title="Меню">🏠</button>
  </div>
  <div class="grid-container" id="game-board">
    <div id="grid-cells"></div>
    <div class="tile-container" id="tile-container"></div>
    <div id="gameOverlay" class="game-over">
      Игра окончена!<br><button id="restartBtn">Заново</button>
    </div>
  </div>
</div>

<!-- Модальные окна -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <h3>Настройки</h3>
    <div class="settings-group"><label>Размер поля:</label><select id="boardSizeSelect"><option value="3">3x3</option><option value="4">4x4</option><option value="5">5x5</option><option value="6">6x6</option><option value="7">7x7</option></select></div>
    <div class="settings-group"><label><input type="checkbox" id="endlessModeCheck"> Бесконечный режим (после 2048)</label></div>
    <div class="settings-group"><label><input type="checkbox" id="soundToggle"> Звуки</label></div>
    <div class="settings-group"><label>Начальные плитки:</label><select id="startTilesSelect"><option value="classic">Стандарт (2+2)</option><option value="easy">Лёгкий (4+4)</option></select></div>
    <div class="settings-group"><label><input type="checkbox" id="editModeToggle"> Режим редактирования (клик по клетке)</label></div>
    <button id="applySettingsBtn">Применить и перезапустить</button>
  </div>
</div>
<div id="recordsModal" class="modal"><div class="modal-content"><span class="close-modal">&times;</span><h3>Лучшие результаты</h3><ul id="recordsList"></ul></div></div>

<script>
  // ---------- Глобальные переменные ----------
  let board = [];
  let score = 0;
  let bestScore = localStorage.getItem('best2048') ? parseInt(localStorage.getItem('best2048')) : 0;
  let gameActive = true;
  let processing = false;
  let size = 4;
  let endlessMode = false;
  let soundEnabled = true;
  let startTilesType = 'classic';
  let editMode = false;
  let history = [];
  const MAX_HISTORY = 5;
  let timerSeconds = 0;
  let timerInterval = null;
  let timerActive = false;

  // Аудио
  let audioCtx = null;
  function initAudio() {
    if (!soundEnabled) return;
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }
  function playSound(type) {
    if (!soundEnabled) return;
    if (!audioCtx) initAudio();
    if (!audioCtx) return;
    try {
      let now = audioCtx.currentTime;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = type === 'move' ? 440 : 880;
      gain.gain.value = 0.2;
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.00001, now + 0.2);
      osc.stop(now + 0.2);
    } catch(e) {}
  }

  const colors = {
    2: { bg: '#eee4da', color: '#776e65' }, 4: { bg: '#ede0c8', color: '#776e65' },
    8: { bg: '#f2b179', color: '#f9f6f2' }, 16: { bg: '#f59563', color: '#f9f6f2' },
    32: { bg: '#f67c5f', color: '#f9f6f2' }, 64: { bg: '#f65e3b', color: '#f9f6f2' },
    128: { bg: '#edcf72', color: '#f9f6f2' }, 256: { bg: '#edcc61', color: '#f9f6f2' },
    512: { bg: '#edc850', color: '#f9f6f2' }, 1024: { bg: '#edc53f', color: '#f9f6f2' },
    2048: { bg: '#edc22e', color: '#f9f6f2' }, 'super': { bg: '#3c3a32', color: '#f9f6f2' }
  };

  const mainMenu = document.getElementById('mainMenu');
  const gameContainer = document.getElementById('gameContainer');
  const tileContainer = document.getElementById('tile-container');
  const gridCellsDiv = document.getElementById('grid-cells');
  const scoreSpan = document.getElementById('score');
  const bestSpan = document.getElementById('best');
  const timerSpan = document.getElementById('timer');
  const boardElement = document.getElementById('game-board');

  function showToast(msg) {
    let toast = document.createElement('div');
    toast.className = 'toast';
    toast.innerText = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2000);
  }

  function copyBoard(b) { return b.map(row => [...row]); }

  function updateScoreUI() {
    scoreSpan.innerText = score;
    if (score > bestScore) {
      bestScore = score;
      bestSpan.innerText = bestScore;
      localStorage.setItem('best2048', bestScore);
    }
  }

  function slideRowWithScore(row) {
    let arr = row.filter(v => v !== 0);
    let gained = 0;
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i+1]) {
        arr[i] *= 2;
        gained += arr[i];
        arr.splice(i+1, 1);
      }
    }
    while (arr.length < size) arr.push(0);
    return { newRow: arr, gainedScore: gained };
  }

  function slideRow(row, addScore = true) {
    let { newRow, gainedScore } = slideRowWithScore(row);
    if (addScore) score += gainedScore;
    return newRow;
  }

  function move(direction) {
    if (!gameActive || processing || editMode) return false;
    processing = true;
    let oldBoard = copyBoard(board);
    let oldScore = score;
    let moved = false;

    if (direction === 'left') {
      for (let i = 0; i < size; i++) {
        let newRow = slideRow(board[i], true);
        if (JSON.stringify(board[i]) !== JSON.stringify(newRow)) moved = true;
        board[i] = newRow;
      }
    } else if (direction === 'right') {
      for (let i = 0; i < size; i++) {
        let rev = [...board[i]].reverse();
        let newRow = slideRow(rev, true).reverse();
        if (JSON.stringify(board[i]) !== JSON.stringify(newRow)) moved = true;
        board[i] = newRow;
      }
    } else if (direction === 'up') {
      for (let j = 0; j < size; j++) {
        let col = board.map(row => row[j]);
        let newCol = slideRow(col, true);
        for (let i = 0; i < size; i++) {
          if (board[i][j] !== newCol[i]) moved = true;
          board[i][j] = newCol[i];
        }
      }
    } else if (direction === 'down') {
      for (let j = 0; j < size; j++) {
        let col = board.map(row => row[j]).reverse();
        let newCol = slideRow(col, true).reverse();
        for (let i = 0; i < size; i++) {
          if (board[i][j] !== newCol[i]) moved = true;
          board[i][j] = newCol[i];
        }
      }
    }

    if (moved) {
      history.unshift({ board: copyBoard(oldBoard), score: oldScore });
      if (history.length > MAX_HISTORY) history.pop();
      addRandomTile();
      updateBoardVisual();
      if (soundEnabled) playSound('move');
      checkGameOver();
      saveGameState();
      if (endlessMode && isGameOver()) {
        showToast('Нет ходов! Нажмите "Новая игра"');
      }
    }
    processing = false;
    return moved;
  }

  function addRandomTile() {
    let empty = [];
    for (let i = 0; i < size; i++)
      for (let j = 0; j < size; j++)
        if (board[i][j] === 0) empty.push([i, j]);
    if (empty.length === 0) return;
    let [r, c] = empty[Math.floor(Math.random() * empty.length)];
    let value = Math.random() < 0.9 ? 2 : 4;
    board[r][c] = value;
  }

  function updateBoardVisual() {
    gridCellsDiv.innerHTML = '';
    for (let i = 0; i < size * size; i++) {
      let cell = document.createElement('div');
      cell.className = 'grid-cell';
      gridCellsDiv.appendChild(cell);
    }
    
    gridCellsDiv.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    tileContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;

    tileContainer.innerHTML = '';
    for (let i = 0; i < size; i++) {
      for (let j = 0; j < size; j++) {
        let val = board[i][j];
        let tile = document.createElement('div');
        tile.className = 'tile';
        if (val > 0) {
          tile.innerText = val;
          let style = colors[val] || colors['super'];
          tile.style.backgroundColor = style.bg;
          tile.style.color = style.color;
        } else {
          tile.style.backgroundColor = 'transparent';
        }
        tileContainer.appendChild(tile);
      }
    }
    updateScoreUI();
    if (editMode) enableEditMode();
    else disableEditMode();
  }

  function enableEditMode() {
    const tiles = document.querySelectorAll('.tile');
    tiles.forEach((tile, idx) => {
      tile.style.pointerEvents = 'auto';
      tile.style.cursor = 'pointer';
      tile.onclick = (e) => {
        e.stopPropagation();
        let r = Math.floor(idx / size);
        let c = idx % size;
        let val = prompt('Введите число (0 для удаления):', board[r][c]);
        if (val !== null) {
          let num = parseInt(val);
          if (isNaN(num)) num = 0;
          board[r][c] = num;
          updateBoardVisual();
          saveGameState();
        }
      };
    });
  }
  function disableEditMode() {
    const tiles = document.querySelectorAll('.tile');
    tiles.forEach(tile => {
      tile.style.pointerEvents = 'none';
      tile.onclick = null;
    });
  }

  function checkGameOver() {
    if (isGameOver()) {
      if (endlessMode) return;
      gameActive = false;
      document.getElementById('gameOverlay').style.display = 'flex';
      stopTimer();
      saveRecord();
    }
  }

  function isGameOver() {
    for (let i = 0; i < size; i++)
      for (let j = 0; j < size; j++)
        if (board[i][j] === 0) return false;
    for (let i = 0; i < size; i++)
      for (let j = 0; j < size-1; j++)
        if (board[i][j] === board[i][j+1]) return false;
    for (let i = 0; i < size-1; i++)
      for (let j = 0; j < size; j++)
        if (board[i][j] === board[i+1][j]) return false;
    return true;
  }

  function undo() {
    if (!gameActive || processing || history.length === 0 || editMode) return;
    processing = true;
    let last = history.shift();
    board = copyBoard(last.board);
    score = last.score;
    updateBoardVisual();
    gameActive = true;
    document.getElementById('gameOverlay').style.display = 'none';
    saveGameState();
    processing = false;
    if (soundEnabled) playSound('undo');
  }

  function maybeSaveRecord() {
    if (score > 0 && gameActive) {
      saveRecord();
    }
  }

  function saveRecord() {
    let records = JSON.parse(localStorage.getItem('records2048') || '[]');
    records.push({ score, maxTile: getMaxTile(), date: new Date().toLocaleString() });
    records.sort((a,b) => b.score - a.score);
    if (records.length > 10) records = records.slice(0,10);
    localStorage.setItem('records2048', JSON.stringify(records));
  }

  function getMaxTile() { let max=0; for(let i=0;i<size;i++) for(let j=0;j<size;j++) if(board[i][j]>max) max=board[i][j]; return max; }
  
  function showRecords() {
    let records = JSON.parse(localStorage.getItem('records2048') || '[]');
    let list = document.getElementById('recordsList');
    list.innerHTML = '';
    records.forEach(r => {
      let li = document.createElement('li');
      li.innerHTML = `<span>${r.score} очков</span> <span>${r.maxTile}</span> <span>${r.date}</span>`;
      list.appendChild(li);
    });
    // небольшая задержка, чтобы убедиться, что список обновлён
    setTimeout(() => {
      document.getElementById('recordsModal').style.display = 'flex';
    }, 10);
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerActive = true;
    timerInterval = setInterval(() => {
      if (gameActive && timerActive) {
        timerSeconds++;
        let mins = Math.floor(timerSeconds / 60);
        let secs = timerSeconds % 60;
        timerSpan.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
      }
    }, 1000);
  }
  function stopTimer() { 
    if (timerInterval) clearInterval(timerInterval); 
    timerActive = false; 
  }

  function saveGameState() {
    let state = { board, score, size, endlessMode, timerSeconds, gameActive, startTilesType, editMode };
    localStorage.setItem('autoSave2048', JSON.stringify(state));
  }

  function loadAutoSave() {
    let saved = localStorage.getItem('autoSave2048');
    if (saved) {
      let data = JSON.parse(saved);
      if (confirm('Найдено сохранение. Продолжить?')) {
        board = data.board;
        score = data.score;
        size = data.size;
        endlessMode = data.endlessMode;
        timerSeconds = data.timerSeconds;
        gameActive = data.gameActive;
        startTilesType = data.startTilesType || 'classic';
        editMode = data.editMode || false;
        updateBoardVisual();
        updateScoreUI();
        let mins = Math.floor(timerSeconds / 60);
        let secs = timerSeconds % 60;
        timerSpan.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        startTimer();
        if (!gameActive) {
          document.getElementById('gameOverlay').style.display = 'flex';
        } else {
          document.getElementById('gameOverlay').style.display = 'none';
        }
        document.getElementById('boardSizeSelect').value = size;
        document.getElementById('endlessModeCheck').checked = endlessMode;
        document.getElementById('soundToggle').checked = soundEnabled;
        document.getElementById('startTilesSelect').value = startTilesType;
        document.getElementById('editModeToggle').checked = editMode;
        mainMenu.style.display = 'none';
        gameContainer.style.display = 'flex';
        return true;
      }
    }
    return false;
  }

  function initNewGame(selectedEndless) {
    maybeSaveRecord();
    stopTimer();
    
    timerSeconds = 0;
    timerSpan.innerText = '00:00';
    
    size = parseInt(document.getElementById('boardSizeSelect').value);
    endlessMode = selectedEndless !== undefined ? selectedEndless : document.getElementById('endlessModeCheck').checked;
    soundEnabled = document.getElementById('soundToggle').checked;
    startTilesType = document.getElementById('startTilesSelect').value;
    editMode = document.getElementById('editModeToggle').checked;
    saveSettings();

    board = Array(size).fill().map(() => Array(size).fill(0));
    score = 0;
    gameActive = true;
    history = [];

    if (startTilesType === 'easy') {
      let empty = [];
      for (let i = 0; i < size; i++)
        for (let j = 0; j < size; j++)
          empty.push([i, j]);
      let idx1 = Math.floor(Math.random() * empty.length);
      let [r1, c1] = empty[idx1];
      board[r1][c1] = 4;
      empty.splice(idx1, 1);
      let idx2 = Math.floor(Math.random() * empty.length);
      let [r2, c2] = empty[idx2];
      board[r2][c2] = 4;
    } else {
      addRandomTile();
      addRandomTile();
    }

    updateBoardVisual();
    updateScoreUI();
    startTimer();
    saveGameState();
    document.getElementById('gameOverlay').style.display = 'none';
  }

  function saveSettings() {
    localStorage.setItem('boardSize', size);
    localStorage.setItem('endlessMode', endlessMode);
    localStorage.setItem('soundEnabled', soundEnabled);
    localStorage.setItem('startTilesType', startTilesType);
    localStorage.setItem('editMode', editMode);
  }

  function loadSettingsToUI() {
    document.getElementById('boardSizeSelect').value = localStorage.getItem('boardSize') || '4';
    document.getElementById('endlessModeCheck').checked = localStorage.getItem('endlessMode') === 'true';
    document.getElementById('soundToggle').checked = localStorage.getItem('soundEnabled') !== 'false';
    document.getElementById('startTilesSelect').value = localStorage.getItem('startTilesType') || 'classic';
    document.getElementById('editModeToggle').checked = localStorage.getItem('editMode') === 'true';
  }

  function startGameFromMenu(endless) {
    loadSettingsToUI();
    initNewGame(endless);
    mainMenu.style.display = 'none';
    gameContainer.style.display = 'flex';
  }

  function exitToMenu() {
    maybeSaveRecord();
    stopTimer();
    mainMenu.style.display = 'flex';
    gameContainer.style.display = 'none';
  }

  function applySettingsAndRestart() {
    initNewGame(document.getElementById('endlessModeCheck').checked);
    document.getElementById('settingsModal').style.display = 'none';
  }

  // Закрытие модальных окон
  document.querySelectorAll('.close-modal').forEach(el => {
    el.onclick = () => el.closest('.modal').style.display = 'none';
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal').forEach(modal => modal.style.display = 'none');
    }
  });

  function isAnyModalOpen() {
    return document.getElementById('settingsModal').style.display === 'flex' ||
           document.getElementById('recordsModal').style.display === 'flex';
  }

  // Назначение обработчиков
  document.getElementById('startClassicBtn').onclick = () => startGameFromMenu(false);
  document.getElementById('startEndlessBtn').onclick = () => startGameFromMenu(true);
  document.getElementById('openSettingsBtn').onclick = () => { loadSettingsToUI(); document.getElementById('settingsModal').style.display = 'flex'; };
  document.getElementById('recordsMenuBtn').onclick = () => showRecords();
  document.getElementById('recordsBtn').onclick = () => showRecords();
  document.getElementById('settingsGameBtn').onclick = () => { loadSettingsToUI(); document.getElementById('settingsModal').style.display = 'flex'; };
  document.getElementById('newGameBtn').onclick = () => initNewGame(endlessMode);
  document.getElementById('undoBtn').onclick = () => undo();
  document.getElementById('exitToMenuBtn').onclick = () => exitToMenu();
  document.getElementById('applySettingsBtn').onclick = applySettingsAndRestart;
  document.getElementById('restartBtn').onclick = () => initNewGame(endlessMode);

  // Тач-управление
  let touchStartX = 0, touchStartY = 0;
  boardElement.addEventListener('touchstart', (e) => {
    if (!gameActive || editMode || isAnyModalOpen()) return;
    const touch = e.touches[0];
    touchStartX = touch.clientX;
    touchStartY = touch.clientY;
  }, { passive: false });

  boardElement.addEventListener('touchend', (e) => {
    if (!gameActive || editMode || isAnyModalOpen()) return;
    const touchEnd = e.changedTouches[0];
    const dx = touchEnd.clientX - touchStartX;
    const dy = touchEnd.clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx > 0) move('right');
      else move('left');
    } else {
      if (dy > 0) move('down');
      else move('up');
    }
    e.preventDefault();
  }, { passive: false });

  // Клавиатура
  window.addEventListener('keydown', (e) => {
    if (gameContainer.style.display !== 'flex' || isAnyModalOpen() || editMode) return;
    const key = e.key;
    if (key === 'ArrowLeft') move('left');
    else if (key === 'ArrowRight') move('right');
    else if (key === 'ArrowUp') move('up');
    else if (key === 'ArrowDown') move('down');
    else if (key === 'z' && (e.ctrlKey || e.metaKey)) undo();
    else return;
    e.preventDefault();
  });

  bestSpan.innerText = bestScore;
  mainMenu.style.display = 'flex';
  gameContainer.style.display = 'none';

  // Автовосстановление при загрузке
  if (!loadAutoSave()) {
    // меню уже показано
  }
</script>
</body>
</html>
